<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人相册管理系统 - 管理台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- 阿里云 OSS SDK -->
  <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
  <!-- EXIF.js 用于读取图片 EXIF 信息 -->
  <script src="js/vendor/exif.js"></script>
</head>
<body class="admin-body">
  <div class="admin-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>相册管理系统</h1>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="#sites" class="nav-item" data-page="sites">站点管理</a></li>
          <li><a href="#albums" class="nav-item" data-page="albums">相册管理</a></li>
          <li><a href="#tags" class="nav-item" data-page="tags">标签管理</a></li>
          <li><a href="#banners" class="nav-item" data-page="banners">轮播图管理</a></li>
          <li><a href="#" id="logout-btn" class="nav-item logout">退出登录</a></li>
        </ul>
      </nav>
    </aside>
    
    <!-- 主内容区 -->
    <main class="main-content">
      <header class="content-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 id="page-title">站点管理</h2>
          <div>
            <button id="change-password-btn" class="btn btn-secondary" style="margin-right: 10px;">修改密码</button>
          </div>
        </div>
      </header>
      <div class="content-body" id="content-body">
        <!-- 页面内容将通过JavaScript动态加载 -->
      </div>
    </main>
  </div>
  
  <!-- 修改密码模态框 -->
  <div id="change-password-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>修改密码</h3>
        <span class="close">&times;</span>
      </div>
      <div class="modal-body">
        <form id="change-password-form">
          <div class="form-group">
            <label for="old-password">旧密码</label>
            <input type="password" id="old-password" name="oldPassword" placeholder="请输入旧密码" required>
          </div>
          <div class="form-group">
            <label for="new-password">新密码</label>
            <input type="password" id="new-password" name="newPassword" placeholder="请输入新密码 (6-20位)" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="cancel-change-password" class="btn btn-secondary">取消</button>
        <button id="confirm-change-password" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="js/app.js"></script>
</body>
</html>
