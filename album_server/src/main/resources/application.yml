server:
  port: 8888
  servlet:
    context-path: /api

spring:
  application:
    name: album-admin
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://MYSQL_HOST/album_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: MYSQL_USER_NAME
    password: MYSQL_USER_PASSWORD
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: AlbumHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=3600s
  web:
    resources:
      add-mappings: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.album.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

# Logging Configuration
logging:
  level:
    root: INFO
    com.album.admin: DEBUG
    com.album.admin.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"


# JWT/Token Configuration
token:
  expiration: 86400 # Token 有效期 (秒) - 24 小时

# Login Security Configuration
security:
  login:
    max-fail-count: 5 # 最大失败次数
    lock-time: 1800 # 锁定时长 (秒) - 30 分钟

# Alibaba Cloud OSS Configuration
# STS授权参考：https://help.aliyun.com/zh/oss/user-guide/uploading-objects-to-oss-directly-from-clients/?spm=a2c4g.11174283.help-menu-31815.d_0_3_2.12686a75rEeRQj
aliyun:
  oss:
    region: 
    access-key-id: 
    access-key-secret: 
    sts-duration-seconds: 3600
    role-arn: 
    bucket-name: 
    bucket-domain: 
